name: Python R&D CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run python -m compileall -q src tests
      - run: uv run pytest --cov=swipe_dating --cov-branch --cov-report=term-missing
      - run: uv run ruff check .
      - run: uv run ruff format --diff .
      - run: uv run mypy src
      - run: uv run swipe-governance
      - run: uv run swipe-simulate
